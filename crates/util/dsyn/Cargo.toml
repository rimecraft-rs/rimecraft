[package]
name = "rimecraft-dsyn"
version = "0.1.0"
edition = "2024"
authors = ["JieningYu <jiening.yu@outlook.com>"]
description = "DSyN the descriptor set system"
repository = "https://codeberg.org/DM-Earth/rimecraft/"
license = "AGPL-3.0-or-later"
categories = ["rust-patterns"]

[badges]
maintenance = { status = "passively-maintained" }

[dependencies]
typeid = { version = "1.0", optional = true }
rustc-hash = "2.1"

[dev-dependencies]
typeid = "1.0"
static_assertions = "1.1"

[features]
simple-registry = ["dep:typeid"]

[lints]
workspace = true
